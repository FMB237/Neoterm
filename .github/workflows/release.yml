name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release
        run: cargo build --release

      - name: Copy license and assets to crate for cargo-deb/cargo-wix
        run: |
          cp LICENSE crates/neoterm/LICENSE
          cp LICENSE.rtf crates/neoterm/LICENSE.rtf
          cp assets/neoterm.ico crates/neoterm/neoterm.ico

      - name: Build .deb package
        run: cargo deb --no-build --manifest-path crates/neoterm/Cargo.toml

      - name: Create checksums
        run: |
          cd target/release
          sha256sum neoterm 2>/dev/null | tee checksums.txt
          sha256sum neoterm > neoterm.sha256
          if ls *.deb 1> /dev/null 2>&1; then
            sha256sum *.deb >> checksums.txt
          fi

      - name: Create release archive
        run: |
          cd target/release
          tar -czf neoterm-linux-x86_64.tar.gz neoterm 2>/dev/null || true

      - name: Copy .deb to release directory for upload
        run: cp target/debian/*.deb target/release/ 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/neoterm
            target/release/checksums.txt
            target/release/neoterm.sha256
            target/release/neoterm-linux-x86_64.tar.gz
            target/release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Copy license and assets to crate for cargo-wix
        run: |
          Copy-Item LICENSE.rtf crates/neoterm/wix/LICENSE.rtf
          Copy-Item assets/neoterm.ico crates/neoterm/wix/neoterm.ico

      - name: Build release
        run: cargo build --release

      - name: Build Windows installer (MSI)
        run: cargo wix --no-build --bin-path target/release/neoterm.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: neoterm-windows
          path: target/release/neoterm.exe
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: neoterm-windows-installer
          path: target/wix/*.msi
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release
        run: cargo build --release

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: neoterm-macos
          path: target/release/neoterm
          retention-days: 30
